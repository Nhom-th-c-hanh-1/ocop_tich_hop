<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký người tiêu dùng - OCOP</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .register-wrap{max-width:480px;margin:42px auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 8px 28px #0001}
    .register-wrap h1{margin-top:0;text-align:center}.register-wrap label{display:block;margin:14px 0 6px;font-weight:700}
    .register-wrap input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}
    .register-wrap button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:#237a42;color:#fff;font-weight:700;cursor:pointer}
    .register-wrap button:disabled{opacity:.65;cursor:wait}#registerMessage{margin-top:14px;line-height:1.5}
    .back-link{display:block;text-align:center;margin-top:18px}.form-note{font-size:.92rem;color:#555;line-height:1.5}
  </style>
</head>
<body>
  <header>
    <div class="logo"><div class="logo-icon">🌿</div><div class="logo-text">OC<br>OP</div></div>
    <nav><a href="index.html">TRANG CHỦ</a><a href="products.html">SẢN PHẨM</a><a href="trace-product.html">TRA CỨU</a><a href="scan-qr.html">QUÉT QR</a></nav>
  </header>
  <main class="register-wrap">
    <h1>Đăng ký người tiêu dùng</h1>
    <p class="form-note">Tạo tài khoản để đăng nhập hệ thống. Bạn vẫn có thể xem sản phẩm, tra cứu nguồn gốc và quét QR mà không cần đăng nhập.</p>
    <form id="registerForm">
      <label for="hoTen">Họ và tên *</label>
      <input id="hoTen" name="hoTen" maxlength="100" autocomplete="name" required>
      <label for="tenDangNhap">Tên đăng nhập *</label>
      <input id="tenDangNhap" name="tenDangNhap" minlength="4" maxlength="100" pattern="[A-Za-z0-9_.-]{4,100}" title="Từ 4 ký tự, chỉ dùng chữ không dấu, số, dấu chấm, gạch dưới hoặc gạch ngang" autocomplete="username" required>
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" maxlength="100" autocomplete="email" required>
      <label for="soDienThoai">Số điện thoại (không bắt buộc)</label>
      <input id="soDienThoai" name="soDienThoai" type="tel" maxlength="20" autocomplete="tel">
      <label for="matKhau">Mật khẩu *</label>
      <input id="matKhau" name="matKhau" type="password" minlength="8" autocomplete="new-password" required>
      <label for="xacNhanMatKhau">Nhập lại mật khẩu *</label>
      <input id="xacNhanMatKhau" name="xacNhanMatKhau" type="password" minlength="8" autocomplete="new-password" required>
      <button type="submit" id="registerButton">Tạo tài khoản</button>
    </form>
    <p id="registerMessage" role="status" aria-live="polite"></p>
    <a class="back-link" href="login.html">Đã có tài khoản? Đăng nhập</a>
    <a class="back-link" href="index.html">Quay lại trang chủ</a>
  </main>
  <script src="js/register.js"></script>
</body>
</html>
