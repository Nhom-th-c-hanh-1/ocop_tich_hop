
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm OCOP</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            color: #26352b;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px #00000012;
        }

        h2 { color: #237a3b; margin-top: 0; }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea { min-height: 85px; resize: vertical; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        button, .back {
            border: 0;
            border-radius: 6px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        .save { background: #237a3b; color: white; }
        .back { background: #e5e9e5; color: #26352b; }

        #message { margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Thêm sản phẩm OCOP</h2>
    <p>Nhập thông tin sản phẩm để gửi lên hệ thống.</p>

    <form id="productForm">
        <label for="TenSanPham">Tên sản phẩm *</label>
        <input id="TenSanPham" required>

        <label for="MaSanPhamOCOP">Mã sản phẩm OCOP</label>
        <input id="MaSanPhamOCOP">

        <label for="NhomSanPham">Nhóm sản phẩm</label>
        <input id="NhomSanPham">

        <label for="SoSaoOCOP">Số sao OCOP</label>
        <select id="SoSaoOCOP">
            <option value="">Chưa xếp hạng</option>
            <option value="3">3 sao</option>
            <option value="4">4 sao</option>
            <option value="5">5 sao</option>
        </select>

        <label for="MoTa">Mô tả</label>
        <textarea id="MoTa"></textarea>

        <label for="ThanhPhan">Thành phần</label>
        <textarea id="ThanhPhan"></textarea>

        <label for="HuongDanSuDung">Hướng dẫn sử dụng</label>
        <textarea id="HuongDanSuDung"></textarea>

        <label for="BaoQuan">Bảo quản</label>
        <textarea id="BaoQuan"></textarea>

        <label for="HinhAnh">Đường dẫn hình ảnh</label>
        <input id="HinhAnh" placeholder="https://...">

        <div class="actions">
            <button class="save" type="submit">Lưu sản phẩm</button>
            <a class="back" href="products.html">Quay lại</a>
        </div>
    </form>

    <p id="message"></p>
</div>

<script>
const API_URL = 'http://localhost:3000/api/products';
const token = localStorage.getItem('ocopToken');
const message = document.getElementById('message');

if (!token) {
    alert('Bạn cần đăng nhập trước.');
    window.location.href = 'login.html';
}

document.getElementById('productForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const product = {
        TenSanPham: document.getElementById('TenSanPham').value.trim(),
        MaSanPhamOCOP: document.getElementById('MaSanPhamOCOP').value.trim() || null,
        NhomSanPham: document.getElementById('NhomSanPham').value.trim() || null,
        SoSaoOCOP: document.getElementById('SoSaoOCOP').value || null,
        MoTa: document.getElementById('MoTa').value.trim() || null,
        ThanhPhan: document.getElementById('ThanhPhan').value.trim() || null,
        HuongDanSuDung: document.getElementById('HuongDanSuDung').value.trim() || null,
        BaoQuan: document.getElementById('BaoQuan').value.trim() || null,
        HinhAnh: document.getElementById('HinhAnh').value.trim() || null
    };

    message.style.color = '#333';
    message.textContent = 'Đang lưu sản phẩm...';

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(product)
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(data.message || data.error || 'Không thể thêm sản phẩm.');
        }

        message.style.color = 'green';
        message.textContent = 'Thêm sản phẩm thành công!';

        setTimeout(() => {
            window.location.href = 'products.html';
        }, 1000);

    } catch (error) {
        message.style.color = 'red';
        message.textContent = error.message;
    }
});
</script>
</body>
</html>
